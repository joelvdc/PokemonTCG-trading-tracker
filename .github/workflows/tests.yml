# Runs the unit tests, compares the screenshot tests with app/src/test/screenshots and makes a debug
# build on every pull request, so problems show up before merging.
name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest verifyRoborazziDebug assembleDebug
      # When a screen looks different, the new picture and a picture of the differences are kept here.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-differences
          path: app/build/outputs/roborazzi/
